name: Validate and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ent-challange-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor == 'Fairdose' && github.triggering_actor == 'Fairdose'
    runs-on: ubuntu-latest
    env:
      ADMIN_USERNAME: admin@example.invalid
      ADMIN_PASSWORD: ci-test-only-password
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: enteksis_client/pnpm-lock.yaml
      - name: Validate client
        working-directory: enteksis_client
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test:unit -- --run
          pnpm build
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: enteksis_backend/go.sum
      - name: Validate backend
        working-directory: enteksis_backend
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/api
      - name: Validate deployment files
        run: |
          bash -n example/vultr/scripts/*.sh
          docker compose \
            --env-file example/vultr/.env.example \
            --file example/vultr/compose.yaml \
            config --quiet
          docker run --rm \
            --volume "$PWD/example/vultr/nginx/http.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t
      - name: Install Playwright browser
        working-directory: enteksis_client
        run: pnpm exec playwright install --with-deps chromium
      - name: Start integration stack
        run: ./enteksis_client/run.sh start
      - name: Wait for database-aware API health
        run: >-
          curl --fail --silent --show-error --retry 12 --retry-delay 2
          --retry-connrefused http://localhost:8080/health
      - name: Run end-to-end tests
        working-directory: enteksis_client
        run: pnpm test:e2e
      - name: Stop integration stack
        if: ${{ always() }}
        run: ./enteksis_client/run.sh stop

  deploy:
    if: github.actor == 'Fairdose' && github.triggering_actor == 'Fairdose' && github.event_name != 'pull_request' && vars.VPS_DEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: [self-hosted, linux, x64, ent-challange-production]
    environment:
      name: production
      url: https://ent-challange.fairdose.net
    steps:
      - uses: actions/checkout@v5
      - name: Deploy exact revision
        run: bash example/vultr/scripts/deploy-revision.sh "$GITHUB_SHA"
