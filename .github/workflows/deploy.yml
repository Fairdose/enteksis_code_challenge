name: Validate and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ent-challange-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor == 'Fairdose' && github.triggering_actor == 'Fairdose'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ent_challange
          POSTGRES_USER: ent_challange
          POSTGRES_PASSWORD: ent_challange_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ent_challange -d ent_challange"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: enteksis_client/pnpm-lock.yaml
      - name: Validate client
        working-directory: enteksis_client
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test:unit -- --run
          pnpm build
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: enteksis_backend/go.sum
      - name: Validate backend
        working-directory: enteksis_backend
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/api
      - name: Validate deployment files
        run: |
          bash -n example/vultr/scripts/*.sh
          docker compose \
            --env-file example/vultr/.env.example \
            --file example/vultr/compose.yaml \
            config --quiet

  deploy:
    if: github.actor == 'Fairdose' && github.triggering_actor == 'Fairdose' && github.event_name != 'pull_request' && vars.VPS_DEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: [self-hosted, linux, x64, ent-challange-production]
    environment:
      name: production
      url: https://ent-challange.fairdose.net
    steps:
      - uses: actions/checkout@v5
      - name: Deploy exact revision
        run: bash example/vultr/scripts/deploy-revision.sh "$GITHUB_SHA"
