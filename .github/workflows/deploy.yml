name: Validate and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ent-challange-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ent_challange
          POSTGRES_USER: ent_challange
          POSTGRES_PASSWORD: ent_challange_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ent_challange -d ent_challange"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: enteksis_client/pnpm-lock.yaml
      - name: Validate client
        working-directory: enteksis_client
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test:unit -- --run
          pnpm build
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: enteksis_backend/go.sum
      - name: Validate backend
        working-directory: enteksis_backend
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/api
      - name: Validate deployment files
        run: |
          bash -n example/vultr/scripts/*.sh
          docker compose \
            --env-file example/vultr/.env.example \
            --file example/vultr/compose.yaml \
            config --quiet

  deploy:
    if: github.event_name != 'pull_request' && vars.VPS_DEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ent-challange.fairdose.net
    env:
      VPS_HOST: ${{ vars.VPS_HOST || 'fairdose.net' }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_USER: ${{ vars.VPS_USER || 'dev_fairdose' }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure SSH
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
      - name: Deploy exact revision
        run: |
          remote_script=".cache/ent-challange/deploy-${GITHUB_SHA}.sh"
          ssh_options=(
            -i "$HOME/.ssh/deploy_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o "Port=$VPS_PORT"
            -o StrictHostKeyChecking=yes
          )
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            'install -d -m 0700 "$HOME/.cache/ent-challange"'
          scp "${ssh_options[@]}" \
            example/vultr/scripts/deploy-revision.sh \
            "$VPS_USER@$VPS_HOST:$remote_script"
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            'bash "$1" "$2"; status=$?; unlink "$1"; exit $status' \
            bash "$remote_script" "$GITHUB_SHA"
