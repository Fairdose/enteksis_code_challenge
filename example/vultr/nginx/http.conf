limit_req_zone $binary_remote_addr zone=public_form:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=admin_api:10m rate=10r/m;

upstream client_app {
    server 127.0.0.1:8081;
}

upstream api_app {
    server 127.0.0.1:8082;
}

server {
    listen 80;
    listen [::]:80;
    server_name ent-challange.fairdose.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://client_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ent-challange-api.fairdose.net;
    client_max_body_size 16k;
    limit_req_status 429;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /api/v1/requests {
        limit_req zone=public_form burst=10 nodelay;
        proxy_pass http://api_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/admin/ {
        limit_req zone=admin_api burst=10 nodelay;
        proxy_pass http://api_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://api_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
