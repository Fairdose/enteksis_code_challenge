name: ent-challange-production

services:
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/letsencrypt:/etc/letsencrypt:ro
      - ./data/certbot:/var/www/certbot:ro
    depends_on:
      client:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - edge
      - application
    security_opt:
      - no-new-privileges:true

  client:
    build:
      context: ../../enteksis_client
      dockerfile: Containerfile
      args:
        VITE_API_BASE_URL: https://${API_DOMAIN}
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - application
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ../../enteksis_backend
      dockerfile: Containerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      ALLOWED_ORIGINS: https://${FRONTEND_DOMAIN}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - application
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ../../enteksis_backend
      dockerfile: Containerfile.postgres
    restart: "no"
    environment:
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: ["sh", "-c", "for file in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -h db -f \"$$file\"; done"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - application

  db:
    build:
      context: ../../enteksis_backend
      dockerfile: Containerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - application
    security_opt:
      - no-new-privileges:true

  certbot:
    image: certbot/certbot:v5.8.0
    profiles:
      - tools
    volumes:
      - ./data/letsencrypt:/etc/letsencrypt
      - ./data/certbot:/var/www/certbot

volumes:
  postgres-data:

networks:
  edge:
  application:
    internal: true
